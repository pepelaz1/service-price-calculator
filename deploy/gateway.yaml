# Replace BUCKET_NAME and FUNCTION_ID before creating the API Gateway.
# The bucket must allow public read access, or add a service account to
# each object_storage integration.
openapi: 3.0.0
info:
  title: Service Price Calculator Demo
  version: 1.0.0
paths:
  /:
    get:
      summary: React application
      responses:
        '200':
          description: HTML application
      x-yc-apigateway-integration:
        type: object_storage
        bucket: BUCKET_NAME
        object: index.html
  /assets/{file}:
    get:
      summary: Static asset
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Static asset
      x-yc-apigateway-integration:
        type: object_storage
        bucket: BUCKET_NAME
        object: 'assets/{file}'
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is ready
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: FUNCTION_ID
        payload_format_version: '1.0'
  /api/catalog:
    get:
      summary: List cities and services
      responses:
        '200':
          description: Available cities and services
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: FUNCTION_ID
        payload_format_version: '1.0'
  /api/quote:
    post:
      summary: Calculate a quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cityId, serviceId, quantity, urgent]
              properties:
                cityId: { type: string }
                serviceId: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 5 }
                urgent: { type: boolean }
      responses:
        '200':
          description: Calculated quote
        '400':
          description: Invalid input
        '404':
          description: City or service not found
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: FUNCTION_ID
        payload_format_version: '1.0'
